[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-bench"
version = "0.1.0"
description = "Cross-session memory recall benchmark for AI agents — a method, not a product. Measure how well your agent's memory actually remembers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LAAP Project" }]
keywords = ["agent", "memory", "benchmark", "recall", "llm", "eval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
laap = []  # LAAP vault backend requires a LAAP environment; adapter is optional
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/liliMozi/LAAP"
Documentation = "https://github.com/liliMozi/LAAP"

[project.scripts]
recall-bench = "recall_bench.cli:main"

[tool.setuptools.packages.find]
include = ["recall_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
